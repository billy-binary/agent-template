# =============================================================================
# SQUID PROXY CONFIGURATION FOR AZURE ACCESS (SOX5-COMPLIANT)
# Reference configuration for App Configuration, Azure AD, and management access
# =============================================================================

# Network settings
http_port 3128
https_port 3129 cert=/etc/squid/ssl_cert/myCA.pem key=/etc/squid/ssl_key/myCA.key

# ============================================================================
# LOGGING - VERBOSE FOR TROUBLESHOOTING
# ============================================================================

# Access log with detailed format (see below for format definition)
access_log /var/log/squid/access.log logformat_detailed

# Cache log for debugging cache issues
cache_log /var/log/squid/cache.log

# Store logs and rotation
logfile_rotate 10
maximum_object_size_in_memory 512 KB

# Custom log format - includes request details, response time, SSL errors
logformat logformat_detailed [%tl] %6tr %>a %Ss/%03Hs %<st %rm %ru %un %Sh/%<A %mt

# Enable detailed error logging (useful for SSL/auth failures)
debug_options ALL,1 33,2 28,9

# ============================================================================
# ACL DEFINITIONS - AZURE SERVICES
# ============================================================================

# Azure Management Services
acl azure_management dstdomain .management.azure.com
acl azure_management dstdomain management.azure.com

# Azure AD / Authentication
acl azure_ad dstdomain .login.microsoftonline.com
acl azure_ad dstdomain login.microsoftonline.com
acl azure_ad dstdomain .microsoftonline.com

# App Configuration Service (critical for your use case)
acl azure_appconfig dstdomain .azconfig.io
acl azure_appconfig dstdomain azconfig.io

# Azure Resource Manager APIs
acl azure_api dstdomain .api.azureservices.net
acl azure_api dstdomain api.azureservices.net

# Azure Storage (if needed)
acl azure_storage dstdomain .blob.core.windows.net
acl azure_storage dstdomain .queue.core.windows.net
acl azure_storage dstdomain .table.core.windows.net

# Azure Service Bus, Event Hub, etc
acl azure_services dstdomain .servicebus.windows.net
acl azure_services dstdomain .eventhubs.windows.net

# Azure Key Vault
acl azure_keyvault dstdomain .vault.azure.net

# Graph API
acl azure_graph dstdomain graph.microsoft.com
acl azure_graph dstdomain .graph.microsoft.com

# PowerShell/CLI endpoints
acl azure_cli dstdomain aka.ms
acl azure_cli dstdomain .python.org
acl azure_cli dstdomain pypi.org

# Local/internal traffic (bypass proxy)
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localhost src 127.0.0.1/32 ::1

# Safe ports (https is 443, http is 80)
acl Safe_ports port 80 443 8080 8443

# SSL ports
acl SSL_ports port 443 8443 3128 3129

# CONNECT method (used for HTTPS tunneling - CRITICAL for Azure)
acl CONNECT method CONNECT

# ============================================================================
# HTTP ACCESS RULES - ALLOW AZURE TRAFFIC
# ============================================================================

# Allow local traffic to bypass proxy
http_access allow localnet
http_access allow localhost

# Allow CONNECT method for HTTPS tunneling (REQUIRED for Azure)
http_access allow CONNECT Safe_ports

# Block unsafe ports
http_access deny !Safe_ports

# Allow all Azure services
http_access allow azure_management
http_access allow azure_ad
http_access allow azure_appconfig
http_access allow azure_api
http_access allow azure_storage
http_access allow azure_services
http_access allow azure_keyvault
http_access allow azure_graph
http_access allow azure_cli

# Explicit deny all else
http_access deny all

# ============================================================================
# SSL/TLS CONFIGURATION
# ============================================================================

# Do NOT decrypt/inspect HTTPS (pass-through only)
ssl_bump none all

# Allow SSL version negotiation
tls_outgoing_options flags=NO_DEFAULT_CA cafile=/etc/ssl/certs/ca-certificates.crt

# ============================================================================
# CACHING POLICY
# ============================================================================

# Refresh patterns for Azure services (Azure doesn't cache well, so short TTL)
refresh_pattern ^https://.*\.azconfig\.io.*	0	0%	0	override-expire override-lastmod ignore-no-store ignore-no-cache ignore-private
refresh_pattern ^https://.*\.management\.azure\.com.*	0	0%	0	override-expire override-lastmod ignore-no-store ignore-no-cache ignore-private
refresh_pattern ^https://.*login\.microsoftonline\.com.*	0	0%	0	override-expire override-lastmod ignore-no-store ignore-no-cache ignore-private

# Default refresh pattern (conservative)
refresh_pattern .			0	20%	4320

# Disable caching for sensitive requests
cache deny azure_management
cache deny azure_ad
cache deny azure_appconfig

# ============================================================================
# PERFORMANCE & TUNING
# ============================================================================

# Memory usage (adjust based on your system)
cache_mem 256 MB
maximum_object_size 512 MB

# File descriptor limits
max_filedescriptors 8192

# Connection settings
server_persistent_connections on
client_persistent_connections on
connection_idle_timeout 2 minutes

# DNS settings
dns_nameservers 8.8.8.8 8.8.4.4

# ============================================================================
# AUTHENTICATION & AUDIT (SOX5 COMPLIANCE)
# ============================================================================

# Log username (if using auth)
# auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/users

# Log all requests with timestamps for audit trail
log_uses_indirect_client on
log_ip_on_direct on

# Track client identity
client_netmask 255.255.255.255

# ============================================================================
# CERTIFICATE HANDLING (for HTTPS pass-through)
# ============================================================================

# Trust system certificates
cafile /etc/ssl/certs/ca-certificates.crt

# Do NOT use certificate pinning for Azure (Azure rotates certs)
# sslcrtd_program /usr/lib/squid/ssl_crtd -s /var/lib/ssl_db -M 16MB

# ============================================================================
# NOTES FOR YOUR ENVIRONMENT
# ============================================================================
# 1. Port 3128 for HTTP, 3129 for HTTPS (adjust as needed)
# 2. ssl_bump is set to "none" - traffic passes through unmodified
# 3. CONNECT method is allowed for HTTPS tunneling (essential for Azure)
# 4. Logging is verbose; you can reduce after troubleshooting
# 5. No caching for Azure services (prevents stale tokens/auth issues)
# 6. Update ca-certificates if using custom root CA
# 7. DNS is set to Google (8.8.8.8); change if you have internal DNS
